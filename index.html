<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>ROBLOX 3D ENDING</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#122038;overflow:hidden;font:bold 15px monospace;color:#fff;user-select:none}
canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:15px}
#sub{align-self:center;background:rgba(0,0,0,.82);border:2px solid #0f0;padding:10px 18px;text-align:center;max-width:650px}
#end{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transition:1.5s;pointer-events:none}
#end.show{opacity:1;pointer-events:auto}#end h1{font-size:60px;color:#0f0;letter-spacing:8px;text-shadow:0 0 20px #0f0}
button{padding:9px 18px;font:inherit;background:#090;color:#fff;border:2px solid #fff;cursor:pointer;pointer-events:auto}
</style></head><body><canvas id="c"></canvas>
<div id="ui"><div><button onclick="snd()">МУЗЫКА</button></div><div id="sub">ГОРОД ОСВОБОЖДЁН! ПАРАД ПОБЕДЫ...</div></div>
<div id="end"><h1>THE END</h1><p style="color:#aaa;margin:10px">Антидот создан. Человечество спасено.</p><button onclick="location.reload()">ПОВТОРИТЬ</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),sub=document.getElementById('sub'),endDiv=document.getElementById('end'),polys=new Array(),fw=new Array();
let W=cv.width=innerWidth,H=cv.height=innerHeight,ac=null,t=0,ended=0,cam={x:0,y:6,z:-12,lx:0,ly:2,lz:4};
onresize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};
function snd(){try{if(!ac)ac=new(window.AudioContext||webkitAudioContext)();if(ac.state=='suspended')ac.resume();new Array(523,659,784,1046,1318).forEach((f,i)=>{const o=ac.createOscillator(),gn=ac.createGain();o.type='square';o.frequency.value=f;gn.gain.setValueAtTime(.08,ac.currentTime+i*.2);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.2+.19);o.connect(gn);gn.connect(ac.destination);o.start(ac.currentTime+i*.2);o.stop(ac.currentTime+i*.2+.2);});}catch(e){}}
function proj(wx,wy,wz){let dx=wx-cam.x,dy=wy-cam.y,dz=wz-cam.z,fx=cam.lx-cam.x,fy=cam.ly-cam.y,fz=cam.lz-cam.z,fl=Math.hypot(fx,fy,fz)||1;fx/=fl;fy/=fl;fz/=fl;let rx=fz,rz=-fx,rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;let cz=dx*fx+dy*fy+dz*fz;if(cz<.6)return null;let fov=Math.min(W,H)*.85;return{x:W/2+((dx*rx+dz*rz)/cz)*fov,y:H/2-((dx*fy*rz+dy*(fz*rx-fx*rz)-dz*fy*rx)/cz)*fov,z:cz};}
function box(x,y,z,w,h,d,c1,c2,c3){const hw=w/2,hh=h/2,hd=d/2,p=new Array(proj(x-hw,y+hh,z-hd),proj(x+hw,y+hh,z-hd),proj(x+hw,y+hh,z+hd),proj(x-hw,y+hh,z+hd),proj(x-hw,y-hh,z-hd),proj(x+hw,y-hh,z-hd),proj(x+hw,y-hh,z+hd),proj(x-hw,y-hh,z+hd));if(p.some(v=>!v))return;const f=(a,b,c,e,col)=>{const p1=p.slice(a,a+1).shift(),p2=p.slice(b,b+1).shift(),p3=p.slice(c,c+1).shift(),p4=p.slice(e,e+1).shift();polys.push({pts:new Array(p1,p2,p3,p4),z:(p1.z+p2.z+p3.z+p4.z)/4,c:col});};f(0,1,2,3,c1);f(4,5,1,0,c3);f(5,6,2,1,c2);f(7,4,0,3,c2);f(6,7,3,2,c3);}
function r6(x,z,tc,lc,ac1,w,mode){const jmp=mode==1?Math.abs(Math.sin(w))*.45:Math.abs(Math.sin(w))*.15,sw=mode==1?0:Math.sin(w)*.35;box(x-.32,.6+jmp,z+sw,.52,1.2,.52,lc,lc,lc);box(x+.32,.6+jmp,z-sw,.52,1.2,.52,lc,lc,lc);box(x,1.85+jmp,z,1.2,1.3,.6,tc,tc,tc);if(mode==3){box(x-.88,1.9+jmp,z,.48,1.1,.48,ac1,ac1,ac1);box(x+.88,2.85+jmp,z,.48,1.1,.48,ac1,ac1,ac1);box(x+.88,3.65+jmp,z,.35,.65,.35,'#4f8','#0f4','#0d3');}else if(mode==1){const v=Math.sin(w*2.5)*.18;box(x-.72+v,2.15+jmp,z-.45,.46,.46,1,ac1,ac1,ac1);box(x+.72-v,2.15+jmp,z-.45,.46,.46,1,ac1,ac1,ac1);}else{box(x-.88,1.9+jmp,z-sw,.48,1.15,.48,ac1,ac1,ac1);box(x+.88,1.9+jmp,z+sw,.48,1.15,.48,ac1,ac1,ac1);}box(x,2.95+jmp,z,.85,.85,.85,'#fd0','#ec0','#fd0');if(mode==2)box(x,3.32+jmp,z,.96,.38,.96,'#3a5a28','#28401b','#314d22');}
const cols=new Array('#e63946','#3a86ff','#ffbe0b','#8338ec','#06d6a0','#fb5607','#fff','#ff006e'),bCols=new Array('#9e3b3b','#3b629e','#9e873b','#5c6270'),crowd=Array.from({length:24},(_,i)=>({x:(i%2?-1:1)*(8+(i%3)*1.2),z:-8+Math.floor(i/2)*2.3,c:cols.slice(i%8).shift(),ph:i*.6})),sold=Array.from({length:12},(_,i)=>({x:((i%3)-1)*2.3,z:-12-Math.floor(i/3)*3.5,ph:i*.5}));
function loop(){requestAnimationFrame(loop);t+=.016;polys.length=0;g.fillStyle='#182c4d';g.fillRect(0,0,W,H);for(let gz=-15;gz<=30;gz+=5){box(-16,-.25,gz,18,.5,5,'#2e7d32','#1b5e20','#256b29');box(16,-.25,gz,18,.5,5,'#2e7d32','#1b5e20','#256b29');box(0,-.2,gz,14,.5,5,'#454954','#333640','#3d414c');box(0,.08,gz,.4,.05,2.4,'#ffd60a','#e6c000','#ffd60a');}for(let i=-1;i<=2;i++)new Array(-13.5,13.5).forEach((bx,si)=>{const h=7+Math.abs(i*3)%8;box(bx,h/2,i*11,7,h,7.5,bCols.slice((Math.abs(i)+si)%4).shift(),'#2b2e36','#3a3e48');});crowd.forEach(m=>r6(m.x,m.z,m.c,'#2b2d42','#fd0',t*6+m.ph,1));sold.forEach(s=>{s.z+=.045;if(s.z>10)s.z=-14;r6(s.x,s.z,'#386641','#1b4332','#386641',t*8+s.ph,2);});box(0,.55,16.5,3.8,1.1,1.6,'#eef2f6','#cbd5e1','#dde4ec');const hv=t>=12.5;if(!hv)box(0,1.45,16.2,.35,.65,.35,'#4f8','#0f4','#0d3');r6(0,17.8,'#fff','#1d3557','#fff',hv?0:t*10,hv?3:0);if(Math.random()<.08){const fx=(Math.random()-.5)*24,fy=10+Math.random()*6,fz=2+Math.random()*20,fc=cols.slice(Math.floor(Math.random()*8)).shift();for(let i=0;i<12;i++){const a=i*.52,b=(Math.random()-.5)*3.14;fw.push({x:fx,y:fy,z:fz,vx:Math.cos(a)*Math.cos(b)*.22,vy:Math.sin(b)*.22,vz:Math.sin(a)*Math.cos(b)*.22,l:40,c:fc});}}for(let i=fw.length-1;i>=0;i--){const f=fw.slice(i,i+1).shift();f.x+=f.vx;f.y+=f.vy;f.z+=f.vz;f.vy-=.005;f.l--;box(f.x,f.y,f.z,.35,.35,.35,f.c,f.c,f.c);if(f.l<=0)fw.splice(i,1);}polys.sort((a,b)=>b.z-a.z);polys.forEach(pl=>{g.fillStyle=pl.c;g.beginPath();pl.pts.forEach((pt,i)=>i?g.lineTo(pt.x,pt.y):g.moveTo(pt.x,pt.y));g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.18)';g.stroke();});if(t<7){sub.innerText='ВОЕННЫЙ ПАРАД ПОБЕДЫ! ЖИТЕЛИ АПЛОДИРУЮТ ГЕРОЯМ!';cam={x:Math.sin(t*.35)*7,y:6,z:-11+t*1.5,lx:0,ly:2.2,lz:t*1.3+2};}else if(t<12.5){sub.innerText='УЧЁНЫЙ РАЗРАБАТЫВАЕТ АНТИДОТ ОТ ЗАРАЖЕНИЯ НА БУДУЩЕЕ...';cam={x:4.2,y:3.8,z:12.5,lx:0,ly:2.2,lz:17.2};}else{sub.innerText='АНТИДОТ ГОТОВ! ВИРУС ПОБЕЖДЁН НАВСЕГДА!';cam={x:2.4,y:3.4,z:13.4,lx:0,ly:2.7,lz:17.6};if(t>15&&!ended){ended=1;snd();endDiv.classList.add('show');}}}
loop();
</script></body></html>
