<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ROBLOX 3D ENDING</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#122038;overflow:hidden;font-family:monospace;color:#fff;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
#sub{align-self:center;background:rgba(0,0,0,.82);border:2px solid #0f0;padding:12px 22px;font-size:16px;text-align:center;max-width:680px;color:#fff}
#end{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transition:opacity 1.5s;pointer-events:none}
#end.show{opacity:1;pointer-events:auto}
#end h1{font-size:64px;color:#0f0;letter-spacing:8px;text-shadow:0 0 20px #0f0}
button{padding:10px 20px;font-size:15px;font-family:inherit;font-weight:bold;background:#090;color:#fff;border:2px solid #fff;cursor:pointer;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div><button type="button" onclick="startMusic()">ВКЛЮЧИТЬ МУЗЫКУ</button></div>
  <div id="sub">ГОРОД ОСВОБОЖДЁН! НАЧИНАЕТСЯ ПОБЕДНЫЙ ПАРАД...</div>
</div>
<div id="end">
  <h1>THE END</h1>
  <p style="color:#aaa;margin-top:10px;font-size:16px">Учёный создал антидот. Человечество спасено.</p>
  <button type="button" onclick="location.reload()" style="margin-top:20px">ПОВТОРИТЬ КАТСЦЕНУ</button>
</div>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
window.onresize=()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;};

let ac=null;
function startMusic(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state=='suspended')ac.resume();
    const notes=new Array(523,659,784,1046,784,1046,1318);
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(),gn=ac.createGain();
      o.type='square';o.frequency.value=f;
      gn.gain.setValueAtTime(0.08,ac.currentTime+i*0.2);
      gn.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.2+0.19);
      o.connect(gn);gn.connect(ac.destination);
      o.start(ac.currentTime+i*0.2);o.stop(ac.currentTime+i*0.2+0.2);
    });
  }catch(e){}
}

let cam={x:0,y:6.5,z:-12,lx:0,ly:2,lz:4};
function proj(wx,wy,wz){
  let dx=wx-cam.x,dy=wy-cam.y,dz=wz-cam.z;
  let fx=cam.lx-cam.x,fy=cam.ly-cam.y,fz=cam.lz-cam.z;
  let fl=Math.hypot(fx,fy,fz)||1;fx/=fl;fy/=fl;fz/=fl;
  let rx=fz,rz=-fx,rl=Math.hypot(rx,rz)||1;rx/=rl;rz/=rl;
  let ux=fy*rz,uy=fz*rx-fx*rz,uz=-fy*rx;
  let cz=dx*fx+dy*fy+dz*fz;
  if(cz<0.6)return null;
  let cx=dx*rx+dz*rz;
  let cy=dx*ux+dy*uy+dz*uz;
  let fov=Math.min(W,H)*0.85;
  return {x:W/2+(cx/cz)*fov,y:H/2-(cy/cz)*fov,z:cz};
}

const polys=new Array();
function addBox(x,y,z,w,h,d,cTop,cSide,cFront){
  const hw=w/2,hh=h/2,hd=d/2;
  const p=new Array(
    proj(x-hw,y+hh,z-hd),proj(x+hw,y+hh,z-hd),proj(x+hw,y+hh,z+hd),proj(x-hw,y+hh,z+hd),
    proj(x-hw,y-hh,z-hd),proj(x+hw,y-hh,z-hd),proj(x+hw,y-hh,z+hd),proj(x-hw,y-hh,z+hd)
  );
  if(p.some(v=>!v))return;
  function face(i1,i2,i3,i4,c){
    const a=p.slice(i1,i1+1).shift(),b=p.slice(i2,i2+1).shift(),d1=p.slice(i3,i3+1).shift(),e=p.slice(i4,i4+1).shift();
    polys.push({pts:new Array(a,b,d1,e),z:(a.z+b.z+d1.z+e.z)/4,c});
  }
  face(0,1,2,3,cTop);
  face(4,5,1,0,cFront);
  face(5,6,2,1,cSide);
  face(7,4,0,3,cSide);
  face(6,7,3,2,cFront);
}

function addR6(x,y,z,torso,legs,arms,head,walk,clap,helmet,vial){
  const jmp=clap?Math.abs(Math.sin(walk))*0.45:Math.abs(Math.sin(walk))*0.15;
  const sw=clap?0:Math.sin(walk)*0.35;
  const by=y+jmp;
  addBox(x-0.32,by+0.6,z+sw,0.52,1.2,0.52,legs,legs,legs);
  addBox(x+0.32,by+0.6,z-sw,0.52,1.2,0.52,legs,legs,legs);
  addBox(x,by+1.85,z,1.2,1.3,0.6,torso,torso,torso);
  if(vial){
    addBox(x-0.88,by+1.9,z,0.48,1.1,0.48,arms,arms,arms);
    addBox(x+0.88,by+2.85,z,0.48,1.1,0.48,arms,arms,arms);
    addBox(x+0.88,by+3.65,z,0.35,0.65,0.35,'#4f8','#0f4','#0d3');
  }else if(clap){
    const wv=Math.sin(walk*2.5)*0.18;
    addBox(x-0.72+wv,by+2.15,z-0.45,0.46,0.46,1.0,arms,arms,arms);
    addBox(x+0.72-wv,by+2.15,z-0.45,0.46,0.46,1.0,arms,arms,arms);
  }else{
    addBox(x-0.88,by+1.9,z-sw,0.48,1.15,0.48,arms,arms,arms);
    addBox(x+0.88,by+1.9,z+sw,0.48,1.15,0.48,arms,arms,arms);
  }
  addBox(x,by+2.95,z,0.85,0.85,0.85,head,head,head);
  if(helmet)addBox(x,by+3.32,z,0.96,0.38,0.96,'#3a5a28','#28401b','#314d22');
}

const crowd=new Array();
const cols=new Array('#e63946','#3a86ff','#ffbe0b','#8338ec','#06d6a0','#fb5607','#ffffff','#ff006e');
for(let i=0;i<28;i++){
  const side=i%2==0?-1:1;
  crowd.push({
    x:side*(8.0+(i%3)*1.2),
    z:-8+Math.floor(i/2)*2.2,
    c:cols.slice(i%cols.length,i%cols.length+1).shift(),
    ph:i*0.65
  });
}

const soldiers=new Array();
for(let r=0;r<4;r++){
  for(let col=-1;col<=1;col++){
    soldiers.push({x:col*2.3,z:-12-r*3.5,ph:r*0.7});
  }
}

const fireworks=new Array();
const sub=document.getElementById('sub'),endDiv=document.getElementById('end');
let t=0,ended=0;

function loop(){
  requestAnimationFrame(loop);
  t+=0.016;
  polys.length=0;

  // Небо и горизонт
  g.fillStyle='#182c4d';g.fillRect(0,0,W,H);

  // Земля и дорога из плиток (никогда не обрезаются камерой)
  for(let gz=-15;gz<=30;gz+=5){
    addBox(-16,-0.25,gz,18,0.5,5,'#2e7d32','#1b5e20','#256b29');
    addBox(16,-0.25,gz,18,0.5,5,'#2e7d32','#1b5e20','#256b29');
    addBox(0,-0.2,gz,14,0.5,5,'#454954','#333640','#3d414c');
    addBox(0,0.08,gz,0.4,0.05,2.4,'#ffd60a','#e6c000','#ffd60a');
  }

  // 3D-здания по бокам площади
  const bCols=new Array('#9e3b3b','#3b629e','#9e873b','#5c6270');
  for(let i=-1;i<=2;i++){
    new Array(-13.5,13.5).forEach((bx,si)=>{
      const h=7+Math.abs(i*3)%8;
      const c1=bCols.slice((Math.abs(i)+si)%4).shift();
      addBox(bx,h/2,i*11,7,h,7.5,c1,'#2b2e36','#3a3e48');
    });
  }

  // Аплодирующая толпа R6-жителей по бокам
  crowd.forEach(m=>addR6(m.x,0,m.z,m.c,'#2b2d42','#ffd900','#ffd900',t*6+m.ph,1,0,0));

  // Марширующие 3D-военные на параде
  soldiers.forEach(s=>{
    s.z+=0.045;if(s.z>10)s.z=-14;
    addR6(s.x,0,s.z,'#386641','#1b4332','#386641','#ffd900',t*8+s.ph,0,1,0);
  });

  // Лабораторный стол и Учёный с антидотом
  addBox(0,0.55,16.5,3.8,1.1,1.6,'#eef2f6','#cbd5e1','#dde4ec');
  const hasVial=t>=12.5;
  if(!hasVial)addBox(0,1.45,16.2,0.35,0.65,0.35,'#4f8','#0f4','#0d3');
  addR6(0,0,17.8,'#ffffff','#1d3557','#ffffff','#ffd900',hasVial?0:t*10,0,0,hasVial);

  // Салют в 3D-небе
  if(Math.random()<0.08){
    const fx=(Math.random()-0.5)*24,fy=10+Math.random()*6,fz=2+Math.random()*20;
    const fc=cols.slice(Math.floor(Math.random()*cols.length)).shift();
    for(let i=0;i<14;i++){
      const a=i*6.28/14,b=(Math.random()-0.5)*3.14;
      fireworks.push({x:fx,y:fy,z:fz,vx:Math.cos(a)*Math.cos(b)*0.22,vy:Math.sin(b)*0.22,vz:Math.sin(a)*Math.cos(b)*0.22,l:45,c:fc});
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f=fireworks.slice(i,i+1).shift();
    f.x+=f.vx;f.y+=f.vy;f.z+=f.vz;f.vy-=0.005;f.l--;
    addBox(f.x,f.y,f.z,0.35,0.35,0.35,f.c,f.c,f.c);
    if(f.l<=0)fireworks.splice(i,1);
  }

  polys.sort((a,b)=>b.z-a.z);
  polys.forEach(pl=>{
    g.fillStyle=pl.c;
    g.beginPath();
    pl.pts.forEach((pt,idx)=>{if(idx==0)g.moveTo(pt.x,pt.y);else g.lineTo(pt.x,pt.y);});
    g.closePath();
    g.fill();
    g.strokeStyle='rgba(0,0,0,0.18)';
    g.lineWidth=1;
    g.stroke();
  });

  if(t<7){
    sub.innerText='ВОЕННЫЙ ПАРАД ПОБЕДЫ! ЖИТЕЛИ АПЛОДИРУЮТ ГЕРОЯМ!';
    cam.x=Math.sin(t*0.35)*7;cam.y=6.0;cam.z=-11+t*1.5;
    cam.lx=0;cam.ly=2.2;cam.lz=t*1.3+2;
  }else if(t<12.5){
    sub.innerText='УЧЁНЫЙ В ЛАБОРАТОРИИ РАЗРАБАТЫВАЕТ АНТИДОТ ОТ ЗАРАЖЕНИЯ НА БУДУЩЕЕ...';
    cam.x=4.2;cam.y=3.8;cam.z=12.5;
    cam.lx=0;cam.ly=2.2;cam.lz=17.2;
  }else{
    sub.innerText='АНТИДОТ ГОТОВ! ВИРУС ПОБЕЖДЁН НАВСЕГДА!';
    cam.x=2.4;cam.y=3.4;cam.z=13.4;
    cam.lx=0;cam.ly=2.7;cam.lz=17.6;
    if(t>15&&!ended){
      ended=1;
      startMusic();
      endDiv.classList.add('show');
    }
  }
}
loop();
</script>
</body>
</html>
